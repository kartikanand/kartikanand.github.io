---
layout: page
title: ramblings
permalink: "/index.html"
---

<ul class="blog-posts">
    {% for post in collections.posts reversed %}
    <li>
        <a class="blog-post" href="{{ post.url }}">
            <span class="blog-post-title">{{ post.data.title }}</span>
            <time class="blog-post-date" datetime="{{ post.data.date | date: '%Y-%m-%d' }}">{{ post.data.date | date: "%b %d %Y" }}</time>
        </a>
    </li>
    {% endfor %}
</ul>
